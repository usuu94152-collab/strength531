<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strength Log</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p id="viewEyebrow" class="eyebrow">5/3/1 Strength Records</p>
        <h1 id="viewTitle">Strength Log</h1>
        <p id="syncStatus" class="sync-status">시트 데이터를 불러오는 중입니다.</p>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="tiny-button" type="button">새로고침</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="records-panel search-panel app-view active" data-view="search">
        <div class="filter-row">
          <div class="segmented" aria-label="종목 선택">
            <button class="active" type="button" data-lift="Squat">스쿼트</button>
            <button type="button" data-lift="Bench Press">벤치</button>
            <button type="button" data-lift="Deadlift">데드리프트</button>
          </div>
        </div>

        <div class="search-controls">
          <label class="search-card">
            <span class="search-card-top">
              <span>찾을 중량</span>
              <select id="weightUnit" class="unit-select" aria-label="중량 단위">
                <option value="kg">kg</option>
                <option value="lb">lb</option>
              </select>
            </span>
            <div class="search-input-row">
              <input id="weightSearch" type="number" min="0" step="5" placeholder="예: 130" />
              <span id="searchUnitLabel">kg</span>
              <span id="conversionHint" class="conversion-hint">≈ -</span>
            </div>
          </label>
          <div class="hint-row">
            <p id="searchRangeHint" class="search-hint">같은 중량 우선, 주변 기록 자동 포함</p>
            <button id="clearSearchButton" class="link-button" type="button">초기화</button>
          </div>
        </div>

        <div id="searchSummary" class="result-grid"></div>

        <div class="table-header table-header-spaced">
          <h3 id="historyTitle">선택 종목 전체 기록</h3>
          <span id="recordCount">0개</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>중량 × 반복</th>
                <th>e1RM</th>
              </tr>
            </thead>
            <tbody id="recordsTable"></tbody>
          </table>
        </div>
      </section>

      <section class="records-panel app-view" data-view="weights">
        <div class="panel-heading horizontal">
          <div class="table-header stretch-header">
            <h3 id="weightGroupsTitle">중량별 기록</h3>
            <span id="weightGroupCount">0개</span>
          </div>
          <div class="segmented" aria-label="중량별 종목 선택">
            <button class="active" type="button" data-lift="Squat">스쿼트</button>
            <button type="button" data-lift="Bench Press">벤치</button>
            <button type="button" data-lift="Deadlift">데드리프트</button>
          </div>
        </div>
        <div id="weightGroups" class="weight-grid"></div>
      </section>

      <section class="app-view cycle-view" data-view="cycle">
        <div class="section-header">
          <h3>TM · 퍼센트 중량</h3>
          <span>5kg 반올림</span>
        </div>
        <div id="cycleWeights" class="cycle-weight-list"></div>

        <div class="section-header">
          <h3>PR · 최고 e1RM</h3>
        </div>
        <div class="summary-grid" aria-label="e1RM 요약">
          <article class="metric pr-card">
            <div>
              <span>스쿼트</span>
              <small>Squat</small>
              <p id="squatMeta">-</p>
            </div>
            <div class="pr-number">
              <strong id="squatBest">-</strong>
              <em id="squatDelta">-</em>
            </div>
          </article>
          <article class="metric pr-card">
            <div>
              <span>벤치</span>
              <small>Bench Press</small>
              <p id="benchMeta">-</p>
            </div>
            <div class="pr-number">
              <strong id="benchBest">-</strong>
              <em id="benchDelta">-</em>
            </div>
          </article>
          <article class="metric pr-card">
            <div>
              <span>데드리프트</span>
              <small>Deadlift</small>
              <p id="deadliftMeta">-</p>
            </div>
            <div class="pr-number">
              <strong id="deadliftBest">-</strong>
              <em id="deadliftDelta">-</em>
            </div>
          </article>
        </div>

      </section>

      <section class="input-panel app-view" data-view="input">
        <div class="panel-heading">
          <h2>리프트 기록 추가</h2>
          <p>입력한 기록은 구글 시트에 저장됩니다.</p>
        </div>

        <form id="strengthForm" class="stacked-form">
          <div class="form-row">
            <label>
              날짜
              <input id="strengthDate" type="date" required />
            </label>
            <label>
              종목
              <select id="strengthMovement" required>
                <option value="Squat">Squat</option>
                <option value="Bench Press">Bench Press</option>
                <option value="Deadlift">Deadlift</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <label>
              중량 kg
              <input id="strengthWeight" type="number" min="0" step="0.1" placeholder="145" required />
            </label>
            <label>
              반복수
              <input id="strengthReps" type="number" min="1" step="1" placeholder="5" required />
            </label>
          </div>
          <div class="calc-strip">
            <span>자동 계산 · e1RM</span>
            <strong id="e1rmPreview">-</strong>
          </div>
          <div class="form-row">
            <label>
              TM kg
              <input id="strengthTm" type="number" min="0" step="0.1" />
            </label>
            <label>
              메모
              <input id="strengthNote" type="text" />
            </label>
          </div>
          <button type="submit">기록 추가</button>
        </form>
      </section>

    </main>

    <nav class="view-tabs" aria-label="화면 선택">
      <button class="active" type="button" data-view-tab="search" aria-label="검색">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
        <span>검색</span>
      </button>
      <button type="button" data-view-tab="weights" aria-label="중량별">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V5"></path><path d="M5 19h14"></path><path d="M9 16v-5"></path><path d="M13 16V8"></path><path d="M17 16v-3"></path></svg>
        <span>중량별</span>
      </button>
      <button type="button" data-view-tab="cycle" aria-label="사이클">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v3"></path><path d="M17 4v3"></path><path d="M5 8h14"></path><path d="M6 5h12a1 1 0 0 1 1 1v13H5V6a1 1 0 0 1 1-1z"></path><path d="M8 13h2"></path><path d="M12 13h2"></path><path d="M16 13h2"></path></svg>
        <span>사이클</span>
      </button>
      <button type="button" data-view-tab="input" aria-label="입력">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span>입력</span>
      </button>
    </nav>

    <script src="./app.js"></script>
  </body>
</html>
